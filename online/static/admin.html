<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NovaKit Admin</title>
  <style>
    :root {
      --bg: #070b12; --panel: #0d1522; --line: #1a2a3d; --accent: #3dd6c6;
      --accent2: #1a9e92; --text: #e8f0f7; --muted: #7a8fa3; --danger: #ff6b6b; --ok: #5ddea8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", Consolas, monospace;
      background: radial-gradient(ellipse 80% 50% at 20% 0%, #0f2a2a 0%, transparent 55%), var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-size: 1.35rem; color: var(--accent); margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
    .card {
      background: #0d1522ee; border: 1px solid var(--line); border-radius: 14px;
      padding: 18px; margin-bottom: 16px;
    }
    label { display: block; font-size: .72rem; color: var(--muted); margin: 10px 0 5px; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: #0a121c; color: var(--text); font: inherit;
    }
    textarea { min-height: 70px; resize: vertical; }
    button {
      margin-top: 12px; padding: 11px 16px; border: 0; border-radius: 10px;
      background: var(--accent2); color: #041010; font-weight: 700; cursor: pointer; font: inherit;
    }
    button:hover { background: var(--accent); }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    button.small { margin: 0 4px 4px 0; padding: 7px 10px; font-size: .75rem; }
    .err { color: var(--danger); font-size: .85rem; margin-top: 8px; min-height: 1.2em; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #0a121c; }
    .stat b { display: block; font-size: 1.5rem; color: var(--accent); }
    .stat span { color: var(--muted); font-size: .75rem; }
    table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: .68rem; text-transform: uppercase; }
    tr { cursor: pointer; }
    tr:hover td, tr.active td { background: #0a1520; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hidden { display: none !important; }
    .badge { color: var(--ok); font-size: .75rem; }
    .badge.off { color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1.4fr .9fr; gap: 14px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    .kv { font-size: .8rem; line-height: 1.55; }
    .kv b { color: var(--muted); font-weight: 600; display: inline-block; min-width: 110px; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginView" class="card">
      <h1>◈ NovaKit Admin</h1>
      <p class="sub">Créateur uniquement — utilisateurs + pilotage IA</p>
      <label>Utilisateur</label>
      <input id="user" value="Lutre" autocomplete="username" />
      <label>Mot de passe</label>
      <input id="pass" type="password" autocomplete="current-password" />
      <button id="btnLogin">SE CONNECTER</button>
      <div class="err" id="loginErr"></div>
    </div>

    <div id="dashView" class="hidden">
      <div class="top">
        <div>
          <h1>◈ Utilisateurs</h1>
          <p class="sub" style="margin:0">Infos complètes + commandes vers leur IA</p>
        </div>
        <div>
          <button class="ghost" id="btnRefresh" type="button">RAFRAÎCHIR</button>
          <button class="ghost" id="btnLogout" type="button">DÉCONNEXION</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>

      <div class="grid2" style="margin-top:16px">
        <div class="card">
          <div class="top" style="margin-bottom:10px">
            <strong>Comptes</strong>
            <span class="badge" id="liveBadge">● panel</span>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Pseudo</th><th>E-mail</th><th>IA</th><th>IP</th><th>Vu</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        <div class="card" id="detailCard">
          <strong>Détail / pilotage</strong>
          <p class="sub" id="detailEmpty">Clique un utilisateur à gauche.</p>
          <div id="detailBox" class="hidden">
            <div class="kv" id="detailKv"></div>
            <div class="actions">
              <button class="small" type="button" data-act="message">MESSAGE HUD</button>
              <button class="small" type="button" data-act="speak">FAIRE PARLER</button>
              <button class="small" type="button" data-act="ping">PING</button>
              <button class="small" type="button" data-act="status">STATUS</button>
            </div>
            <label>Texte (message / voix)</label>
            <textarea id="cmdText" placeholder="Salut depuis le créateur…"></textarea>
            <div class="err" id="cmdErr"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let selected = null;
    let items = [];

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: "include",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const d = data.detail;
        throw new Error(typeof d === "string" ? d : (data.message || ("HTTP " + res.status)));
      }
      return data;
    }

    function showDash(on) {
      $("loginView").classList.toggle("hidden", on);
      $("dashView").classList.toggle("hidden", !on);
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    function ago(ts) {
      if (!ts) return "—";
      const s = Math.max(0, Math.floor(Date.now()/1000 - Number(ts)));
      if (s < 60) return s + "s";
      if (s < 3600) return Math.floor(s/60) + "m";
      if (s < 86400) return Math.floor(s/3600) + "h";
      return Math.floor(s/86400) + "j";
    }

    function selectUser(id) {
      selected = items.find((x) => x.id === id) || null;
      [...document.querySelectorAll("#rows tr")].forEach((tr) => {
        tr.classList.toggle("active", Number(tr.dataset.id) === id);
      });
      if (!selected) {
        $("detailEmpty").classList.remove("hidden");
        $("detailBox").classList.add("hidden");
        return;
      }
      $("detailEmpty").classList.add("hidden");
      $("detailBox").classList.remove("hidden");
      const r = selected;
      let raw = {};
      try { raw = JSON.parse(r.raw_json || "{}"); } catch(e) {}
      $("detailKv").innerHTML = [
        ["Pseudo", r.pseudo],
        ["E-mail", r.email || "—"],
        ["Nom IA", r.nom_ia],
        ["Ville", r.ville || "—"],
        ["OS / PC", `${r.os || ""} ${r.pc || ""}`.trim() || "—"],
        ["IP publique", r.ip_public || r.ip || "—"],
        ["IP locale", r.ip_local || "—"],
        ["Client ID", r.client_id || "—"],
        ["Version", r.version || "—"],
        ["Dernière vue", ago(r.last_seen)],
        ["Inscrit", (r.when_utc || "").replace("T"," ").slice(0,19) || "—"],
        ["User-Agent", r.user_agent || raw.user_agent || "—"],
      ].map(([k,v]) => `<div><b>${esc(k)}</b> ${esc(v)}</div>`).join("");
    }

    async function sendCmd(action) {
      $("cmdErr").textContent = "";
      if (!selected) return;
      if (!selected.client_id) {
        $("cmdErr").textContent = "Pas de client_id — l'utilisateur doit avoir une version récente + serveur online.";
        return;
      }
      try {
        await api("/api/admin/command", {
          method: "POST",
          body: JSON.stringify({
            install_id: selected.id,
            client_id: selected.client_id,
            action,
            text: $("cmdText").value.trim(),
          }),
        });
        $("cmdErr").style.color = "var(--ok)";
        $("cmdErr").textContent = "Commande envoyée — sera reçue au prochain heartbeat (~25s).";
      } catch (e) {
        $("cmdErr").style.color = "var(--danger)";
        $("cmdErr").textContent = e.message;
      }
    }

    async function load() {
      const me = await api("/api/admin/me");
      const list = await api("/api/admin/installs");
      items = list.items || [];
      const dernier = me.dernier
        ? `${me.dernier.pseudo || "?"} · ${me.dernier.email || "sans mail"}`
        : "—";
      $("stats").innerHTML = `
        <div class="stat"><b>${me.total}</b><span>inscriptions</span></div>
        <div class="stat"><b>${me.uniques_email || 0}</b><span>e-mails</span></div>
        <div class="stat"><b style="font-size:1rem">${esc(dernier)}</b><span>dernier</span></div>
      `;
      $("rows").innerHTML = items.map((r) => `
        <tr data-id="${r.id}">
          <td>${r.id}</td>
          <td>${esc(r.pseudo)}</td>
          <td>${esc(r.email || "—")}</td>
          <td>${esc(r.nom_ia)}</td>
          <td>${esc(r.ip_public || r.ip || "—")}</td>
          <td><span class="badge ${r.last_seen && (Date.now()/1000 - r.last_seen) < 90 ? "" : "off"}">${esc(ago(r.last_seen))}</span></td>
        </tr>
      `).join("") || `<tr><td colspan="6" style="color:var(--muted)">Aucun compte pour l'instant.</td></tr>`;
      [...document.querySelectorAll("#rows tr")].forEach((tr) => {
        tr.onclick = () => selectUser(Number(tr.dataset.id));
      });
      if (selected) selectUser(selected.id);
    }

    $("btnLogin").onclick = async () => {
      $("loginErr").textContent = "";
      try {
        await api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({ username: $("user").value.trim(), password: $("pass").value }),
        });
        showDash(true);
        await load();
      } catch (e) {
        $("loginErr").textContent = e.message || "Erreur";
      }
    };
    $("btnLogout").onclick = async () => {
      await api("/api/admin/logout", { method: "POST", body: "{}" });
      showDash(false);
    };
    $("btnRefresh").onclick = () => load().catch((e) => alert(e.message));
    document.querySelectorAll("[data-act]").forEach((btn) => {
      btn.onclick = () => sendCmd(btn.dataset.act);
    });

    showDash(false);
    api("/api/admin/logout", { method: "POST", body: "{}" }).catch(() => {});
  </script>
</body>
</html>
